<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>4ka 5G - FUP Monitor</title>
    <!-- Knižnica Chart.js pre vykreslenie grafu -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0d1b2a;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #00b4d8; margin-bottom: 20px; }
        
        /* Záložky */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            background-color: #1b263b;
            color: #94a3b8;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: #00b4d8;
            color: #0d1b2a;
        }

        /* Karty */
        .cards {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #1b263b;
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 160px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 { font-size: 11px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
        .card .value { font-size: 18px; font-weight: bold; color: #00b4d8; }

        /* Obsah záložiek */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Kontajner pre graf */
        .chart-container {
            background-color: #1b263b;
            padding: 20px;
            border-radius: 10px;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .section-title {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #update-time {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>4ka 5G - FUP Monitor</h1>

    <!-- Navigačné záložky -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'tab-prehlad')">Prehľad</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-dni')">Dni</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-mesiace')">Mesiace</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-roky')">Roky</button>
    </div>

    <!-- Horné karty pre okamžitý prehľad -->
    <div class="cards">
        <div class="card">
            <h3>Download</h3>
            <div id="download-val" class="value">0.00 GB</div>
        </div>
        <div class="card">
            <h3>Upload</h3>
            <div id="upload-val" class="value">0.00 GB</div>
        </div>
        <div class="card">
            <h3>Celková spotreba</h3>
            <div id="total-val" class="value">0.00 GB</div>
        </div>
        <div class="card">
            <h3>Zostáva z FUP</h3>
            <div class="value">250.00 GB</div>
        </div>
    </div>

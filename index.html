<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4ka 5G - FUP Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 680px; }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 15px; color: #38bdf8; }
        
        .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        @media(min-width: 540px) { .cards { grid-template-columns: repeat(3, 1fr); } }
        .card { background: #1e293b; padding: 14px 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .card h3 { margin: 0 0 6px 0; font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; }
        .card p { margin: 0; font-size: 1.25rem; font-weight: bold; color: #f8fafc; }
        .card.highlight p { color: #38bdf8; }
        .card.warn p { color: #f59e0b; }

        .box { background: #1e293b; padding: 18px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 16px; }
        .box h3 { margin: 0 0 12px 0; font-size: 0.95rem; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .chart-box { height: 280px; position: relative; margin-bottom: 16px; }
        .history-list { list-style: none; padding: 0; margin: 0; font-size: 0.9rem; color: #cbd5e1; }
        .history-list li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #334155; }
        .history-list li:last-child { border-bottom: none; }
        
        .footer { font-size: 0.75rem; color: #64748b; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>4ka 5G - FUP Monitor</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('overview', this)">Prehľad</button>
            <button class="tab-btn" onclick="switchTab('days', this)">Dni</button>
            <button class="tab-btn" onclick="switchTab('months', this)">Mesiace</button>
            <button class="tab-btn" onclick="switchTab('years', this)">Roky</button>
        </div>

        <!-- ZÁLOŽKA 1: PREHĽAD -->
        <div id="tab-overview" class="tab-content active">
            <div class="cards">
                <div class="card highlight">
                    <h3 id="today-title">Dnes</h3>
                    <p id="today-val">0.00 GB</p>
                </div>
                <div class="card">
                    <h3>Týždeň (250GB)</h3>
                    <p id="week-val">0.00 GB</p>
                </div>
                <div class="card">
                    <h3>Zostáva z FUP</h3>
                    <p id="left-val">250.00 GB</p>
                </div>
            </div>

            <div class="box chart-box">
                <canvas id="weeklyChart"></canvas>
            </div>
        </div>

        <!-- ZÁLOŽKA 2: DNI -->
        <div id="tab-days" class="tab-content">
            <div class="box">
                <h3>Archív spotreby po dňoch</h3>
                <ul id="daysList" class="history-list">
                    <li>Zatiaľ žiadne záznamy</li>
                </ul>
            </div>
        </div>

        <!-- ZÁLOŽKA 3: MESIACE -->
        <div id="tab-months" class="tab-content">
            <div class="box">
                <h3>Archív spotreby po mesiacoch</h3>
                <ul id="monthsList" class="history-list">
                    <li>Zatiaľ žiadne záznamy</li>
                </ul>
            </div>
        </div>

        <!-- ZÁLOŽKA 4: ROKY -->
        <div id="tab-years" class="tab-content">
            <div class="box">
                <h3>Archív spotreby po rokoch</h3>
                <ul id="yearsList" class="history-list">
                    <li>Zatiaľ žiadne záznamy</li>
                </ul>
            </div>
        </div>

        <div class="footer" id="timestamp">Načítavam dáta z routera...</div>
    </div>

    <script>
        // Spoľahlivé prepínanie záložiek
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            const selectedTab = document.getElementById('tab-' + tabName);
            if (selectedTab) selectedTab.classList.add('active');
            if (btnElement) btnElement.classList.add('active');
        }

        let chartInstance = null;

        function updateChart(values, todayIndex) {
            const ctx = document.getElementById('weeklyChart');
            if (!ctx) return;
            if (chartInstance) chartInstance.destroy();

            const barColors = values.map((_, idx) => idx === todayIndex ? '#38bdf8' : '#475569');

            chartInstance = new Chart(ctx.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['Po', 'Ut', 'St', 'Št', 'Pi', 'So', 'Ne'],
                    datasets: [{ data: values, backgroundColor: barColors, borderRadius: 6 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 250, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    },
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ` ${ctx.parsed.y.toFixed(2)} GB` } } }
                }
            });
        }

        async function loadData() {
            let weekDays = [0, 0, 0, 0, 0, 0, 0];
            let weekTotal = 0;
            let timestampStr = "Neznáme";

            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (response.ok) {
                    const data = await response.json();
                    weekDays = data.week_days || weekDays;
                    weekTotal = data.week_total || 0;
                    timestampStr = data.timestamp || timestampStr;
                }
            } catch (e) {
                console.warn('Chyba pri načítaní JSON:', e);
            }

            const now = new Date();
            const jsDay = now.getDay();
            const todayIndex = jsDay === 0 ? 6 : jsDay - 1;
            const todayVal = weekDays[todayIndex] || 0;
            const left = Math.max(0, 250 - weekTotal);

            const options = { weekday: 'long', day: 'numeric', month: 'numeric' };
            let dateStr = now.toLocaleDateString('sk-SK', options);
            dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

            document.getElementById('today-title').innerText = 'Dnes (' + dateStr + ')';
            document.getElementById('today-val').innerText = todayVal.toFixed(2) + ' GB';
            document.getElementById('week-val').innerText = weekTotal.toFixed(2) + ' GB';
            document.getElementById('left-val').innerText = left.toFixed(2) + ' GB';
            document.getElementById('timestamp').innerText = 'Posledná aktualizácia z routera: ' + timestampStr;

            // Lokálny archív v localStorage
            try {
                let history = JSON.parse(localStorage.getItem('4ka_history') || '{}');
                if (!history.days) history.days = {};
                if (!history.months) history.months = {};
                if (!history.years) history.years = {};

                const todayKey = now.toISOString().split('T')[0];
                const monthKey = now.toISOString().slice(0, 7);
                const yearKey = now.getFullYear().toString();

                history.days[todayKey] = todayVal;

                let monthSum = 0;
                for (let d in history.days) {
                    if (d.startsWith(monthKey)) monthSum += history.days[d];
                }
                history.months[monthKey] = monthSum;

                let yearSum = 0;
                for (let m in history.months) {
                    if (m.startsWith(yearKey)) yearSum += history.months[m];
                }
                history.years[yearKey] = yearSum;

                localStorage.setItem('4ka_history', JSON.stringify(history));

                const daysList = document.getElementById('daysList');
                if (daysList) {
                    daysList.innerHTML = '';
                    Object.keys(history.days).sort().reverse().forEach(date => {
                        daysList.innerHTML += `<li><span>${date}</span> <strong>${history.days[date].toFixed(2)} GB</strong></li>`;
                    });
                }

                const monthsList = document.getElementById('monthsList');
                if (monthsList) {
                    monthsList.innerHTML = '';
                    Object.keys(history.months).sort().reverse().forEach(month => {
                        monthsList.innerHTML += `<li><span>${month}</span> <strong>${history.months[month].toFixed(2)} GB</strong></li>`;
                    });
                }

                const yearsList = document.getElementById('yearsList');
                if (yearsList) {
                    yearsList.innerHTML = '';
                    Object.keys(history.years).sort().reverse().forEach(year => {
                        yearsList.innerHTML += `<li><span>Rok ${year}</span> <strong>${history.years[year].toFixed(2)} GB</strong></li>`;
                    });
                }
            } catch (err) {
                console.error('Chyba localStorage:', err);
            }

            updateChart(weekDays, todayIndex);
        }

        loadData();
    </script>
</body>
</html>

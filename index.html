<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>4ka 5G - FUP Monitor</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #00b4d8; }
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #1b263b;
            padding: 20px;
            border-radius: 10px;
            width: 220px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 { font-size: 14px; color: #94a3b8; margin-bottom: 10px; }
        .card .value { font-size: 24px; font-weight: bold; color: #00b4d8; }
        #update-time {
            margin-top: 40px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>4ka 5G - FUP Monitor</h1>

    <div class="cards">
        <div class="card">
            <h3>DOWNLOAD (Sťahovanie)</h3>
            <div id="download-val" class="value">0.00 GB</div>
        </div>
        <div class="card">
            <h3>UPLOAD (Odosielanie)</h3>
            <div id="upload-val" class="value">0.00 GB</div>
        </div>
        <div class="card">
            <h3>CELKOVÁ SPOTREBA</h3>
            <div id="total-val" class="value">0.00 GB</div>
        </div>
    </div>

    <div id="update-time">Načítavam dáta...</div>

    <script>
        async function fetchData() {
            try {
                // Pridat ?t=... aby prehliadač nesահoval starú cache verziu
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Chyba pri načítaní data.json');
                
                const data = await response.json();

                // Podpora pre rôzne názvy kľúčov zo skriptu
                const downMb = data.download_mb || data.rx_mb || 0;
                const upMb = data.upload_mb || data.tx_mb || 0;
                const totMb = data.total_mb || (downMb + upMb);

                // Prepočet na GB s 2 desatinnými miestami
                const downGb = (downMb / 1024).toFixed(2);
                const upGb = (upMb / 1024).toFixed(2);
                const totGb = (totMb / 1024).toFixed(2);

                document.getElementById('download-val').innerText = downGb + ' GB';
                document.getElementById('upload-val').innerText = upGb + ' GB';
                document.getElementById('total-val').innerText = totGb + ' GB';
                
                if (data.timestamp) {
                    document.getElementById('update-time').innerText = 'Posledná aktualizácia z routera: ' + data.timestamp;
                }
            } catch (error) {
                console.error('Chyba:', error);
                document.getElementById('update-time').innerText = 'Nepodarilo sa načítať dáta.';
            }
        }

        fetchData();
        // Obnovenie údajov každých 60 sekúnd automaticky
        setInterval(fetchData, 60000);
    </script>

</body>
</html>
